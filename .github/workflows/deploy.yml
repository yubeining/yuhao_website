name: Deploy to Sealos DevBox

# 手动触发：GitHub → Actions → Deploy to Sealos DevBox → Run workflow
#
# ★ 只有 workflow_dispatch，没有 push 触发 —— 部署是【决定】不是【副作用】。
#   自动部署 main 意味着任何一次手滑推送都会直接进生产。
#
# ★★ 本 workflow 不构建任何东西，只发一条 ssh 命令。
#
#    最初的版本在这里打包再 scp 过去，实测跨境速率 8 KB/s：
#    130 MB 的 fat jar 要传 4 个多小时，而 workflow 超时是 25 分钟。
#    GitHub 的 runner 在美欧、Sealos 在北京，这条链路就是这个量级 ——
#    不是配置问题，加多少重试都没用。
#
#    改成 DevBox 自己构建之后，跨境的只剩这条 ssh 命令（几 KB）：
#      源码 DevBox 自己从 GitHub 拉    1.2 MB
#      Maven 依赖走阿里云               实测 20 MB/s
#      npm 依赖走 npmmirror             境内
#
# ★ 本 workflow 从不接触数据库口令 / JWT_SECRET。
#   那些值只存在于 DevBox 上的 /home/devbox/app/.env。
#   GitHub 这边只有一把 SSH 私钥 —— 泄露的爆炸半径小得多。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支（默认 main）'
        required: false
        default: 'main'

# ★ 同一时间只允许一个部署在跑。
#   两个并行会互相覆盖 jar，且回滚逻辑会拿到错的"上一版"。
concurrency:
  group: deploy-devbox
  cancel-in-progress: false

jobs:
  deploy:
    name: 在 DevBox 上构建并部署
    runs-on: ubuntu-latest
    # ★ 构建在 DevBox 上（2C/4G），比 runner 慢。首次拉依赖更久。
    timeout-minutes: 30

    steps:
      # 仓库是私有的，但 Actions 自带的 GITHUB_TOKEN 有读权限，checkout 照常可用。
      # ★ 这一步是 rsync 的数据来源 —— 没有它 runner 上是空目录，
      #   rsync --delete 会把 DevBox 上的源码【全部删光】。
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ★ 统一在这里算一次短 commit，后面所有步骤共用。
      #   各步骤各算各的话，只要有一步的截取长度不一样，
      #   最后"核对线上版本"就会永远不通过 —— 而且看起来像部署失败。
      #   取 github.sha 而不是 git rev-parse：不依赖 checkout 的 fetch 深度。
      - name: 计算版本号
        run: echo "COMMIT=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      # ★ 环境变量一律用 DEVBOX_ 前缀。
      #   写成 USER / HOST / PORT 的话，USER 会覆盖 runner 上的标准 USER 变量 ——
      #   覆盖本身能工作，但任何子进程读 $USER 拿到的都是远端用户名，
      #   这类污染出问题时极难联想到是 workflow 改的。
      - name: 配置 SSH
        env:
          DEVBOX_SSH_KEY: ${{ secrets.DEVBOX_SSH_KEY }}
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_KNOWN_HOSTS: ${{ secrets.DEVBOX_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOX_SSH_KEY:-}" ] || [ -z "${DEVBOX_HOST:-}" ]; then
            echo "::error::缺少 DEVBOX_SSH_KEY 或 DEVBOX_HOST secret，见 deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVBOX_SSH_KEY" > ~/.ssh/devbox
          chmod 600 ~/.ssh/devbox

          if [ -n "${DEVBOX_KNOWN_HOSTS:-}" ]; then
            # ★ 首选：主机公钥固定在 secret 里，能防中间人
            printf '%s\n' "$DEVBOX_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "使用固定的 known_hosts"
          else
            # 退路：每次现扫。方便，但无法验证对方身份 ——
            # 有人劫持了 DNS 或网络，私钥就直接送到对方手里了。
            ssh-keyscan -p "${DEVBOX_PORT:-22}" -H "$DEVBOX_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::未设置 DEVBOX_KNOWN_HOSTS，本次现扫主机公钥（无法防中间人）"
            echo "把下面这些行存成 DEVBOX_KNOWN_HOSTS secret 即可固定："
            cat ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      # ★★ 源码由本 workflow 推给 DevBox，DevBox 不再自己去 GitHub 拉。
      #
      #    仓库转私有之后 DevBox 匿名 clone 失败（could not read Username）。
      #    可以给它配 deploy key，但那需要在 GitHub 上加一把公钥；
      #    这里选择让 Actions 直接把源码送过去 —— Actions 本来就有仓库读权限。
      #
      #    ★ 用 rsync 不用 scp+tar：
      #      - 增量。首次 0.59 MB，之后每次只传改动的几 KB
      #        （跨境链路实测 8 KB/s，每一 KB 都算数）
      #      - --delete 能把仓库里已删除的文件同步删掉。
      #        scp 覆盖式传输做不到这点，会留下"仓库里明明删了却还在编译"的幽灵文件
      #      - 被 --exclude 的路径不会被 --delete 删除，所以 node_modules
      #        和 target 这两个构建缓存能留下来（重装一次要多花好几分钟）
      #
      #    ★ 同步在 build.sh 被调用【之前】完成，所以对 build.sh 自身的修改
      #      当次就生效。早先 build.sh 自己拉代码再执行刚被覆盖的自己，
      #      对它自身的改动永远晚一个版本生效，而且完全静默 —— 踩过一次。
      - name: 推送源码到 DevBox
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          # ★ --delete 的保险丝。checkout 失败或路径不对时 runner 上会是空目录，
          #   那样 rsync --delete 会把 DevBox 上的源码全部删光 ——
          #   下一步构建才报错，而报错内容是"找不到 pom.xml"，
          #   完全看不出真实原因是同步把远端清空了。
          test -f backend/pom.xml && test -f portal/package.json \
            || { echo "::error::runner 上没有源码，中止（避免 rsync --delete 清空远端）"; exit 1; }

          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='backend/src/main/resources/static' \
            -e "ssh -i ~/.ssh/devbox -p ${DEVBOX_PORT:-22}" \
            ./ "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}:/home/devbox/app/src/"
          echo "源码已同步"

      # ★★ 密钥的唯一真源是 GitHub Secrets，部署时覆盖进 DevBox 的 .env。
      #
      #    2026-08-02 的设计是反过来的：GitHub 不碰任何数据密钥，.env 只在 DevBox 上。
      #    2026-09-07 改掉，理由：DevBox 是容器，删了重建或换一台，.env 就没了，
      #    而它没有任何备份 —— 一个没人管的文件不配做唯一真源。
      #    代价是 GitHub token 泄露的爆炸半径变大；仓库私有、Secrets 加密且日志自动打码，接受。
      #    被否决的 Nacos 见 changelog/2026-09-07_secrets-from-github/2-implementation-plan.md。
      #
      #    ★ 只覆盖【非空】的值：GitHub 上没配的项不会把 DevBox 已有的值抹掉。
      #    ★ 值 base64 后走 ssh stdin，不进命令行参数、不进日志。
      #    ★ 非密钥项（地址、桶名）走 Variables，没配就用这里的默认值；
      #      密钥项只能来自 Secrets，缺了直接失败，不等到应用起不来才发现。
      - name: 写入配置（GitHub Secrets → DevBox .env）
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
          # --- 密钥（Secrets）---
          CFG_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CFG_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CFG_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CFG_STORAGE_S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
          CFG_STORAGE_S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
          # --- 非密钥（Variables，可选）---
          CFG_DB_URL: ${{ vars.DB_URL }}
          CFG_DB_USERNAME: ${{ vars.DB_USERNAME }}
          CFG_REDIS_HOST: ${{ vars.REDIS_HOST }}
          CFG_REDIS_PORT: ${{ vars.REDIS_PORT }}
          CFG_STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 's3' }}
          CFG_STORAGE_S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT || 'http://object-storage.objectstorage-system.svc.cluster.local' }}
          CFG_STORAGE_S3_REGION: ${{ vars.STORAGE_S3_REGION || 'us-east-1' }}
          CFG_STORAGE_S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET || 'aprx7mvw-yuhao-oss' }}
        run: |
          set -euo pipefail
          for k in CFG_DB_PASSWORD CFG_JWT_SECRET; do
            [ -n "${!k:-}" ] || { echo "::error::missing GitHub secret ${k#CFG_}，见 deploy/README.md 第 3 步"; exit 1; }
          done
          [ "${#CFG_JWT_SECRET}" -ge 32 ] || { echo "::error::JWT_SECRET 不足 32 字节，应用会拒绝启动"; exit 1; }

          payload=""
          for v in $(compgen -v CFG_); do
            val="${!v}"
            [ -n "$val" ] || continue
            payload+="${v#CFG_}"$'\t'"$(printf '%s' "$val" | base64 -w0)"$'\n'
          done
          echo "覆盖 $(printf '%s' "$payload" | grep -c .) 项：$(printf '%s' "$payload" | cut -f1 | tr '\n' ' ')"

          printf '%s' "$payload" | ssh -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            'bash /home/devbox/app/src/deploy/devbox/apply-env.sh'

      # ★ 构建拆成 前端 / 后端 / 上线 三步，而不是一步跑到底。
      #   Actions 的日志按 step 折叠：拆开之后每一步的耗时和成败在界面上
      #   一目了然，出问题时不用翻整段日志数时间戳去判断是哪个环节慢/挂了。
      #   代价是多两次 SSH 握手（各约 1 秒），完全可以接受。
      - name: 构建前端（DevBox）
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          # -tt 强制分配伪终端，让远端输出实时回流到 Actions 日志，
          # 而不是攒到结束才一次性吐出来。
          ssh -tt -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            "MFG_COMMIT='${{ env.COMMIT }}' bash /home/devbox/app/src/deploy/devbox/build.sh portal"

      - name: 构建后端（DevBox）
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          ssh -tt -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            "MFG_COMMIT='${{ env.COMMIT }}' bash /home/devbox/app/src/deploy/devbox/build.sh backend"

      # 官网是纯静态的，和平台分开发布 —— 改一句文案不该重启交易平台。
      - name: 发布官网（独立端口）
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          ssh -tt -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            "bash /home/devbox/app/src/deploy/devbox/deploy-site.sh"

      - name: 上线（健康检查 + 失败自动回滚）
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          ssh -tt -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            "bash /home/devbox/app/src/deploy/devbox/deploy.sh"

      # 部署完直接核对线上跑的是不是这次的 commit。
      # ★ 不能只信"上一步没报错"：deploy.sh 在回滚成功时也会以非 0 退出，
      #   但更隐蔽的情况是构建产物根本没换成新的 —— 那种情况一切都是绿的。
      - name: 核对线上版本
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://mhswbrrnpspx.sealosbja.site' }}
        run: |
          set -euo pipefail
          LIVE="$(curl -fsS --max-time 30 "$PUBLIC_URL/api/v1/public/ping" \
                  | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"
          echo "期望 ${{ env.COMMIT }} / 线上 $LIVE"
          {
            echo "### 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit | \`${{ env.COMMIT }}\` |"
            echo "| 线上版本 | \`$LIVE\` |"
            echo "| 地址 | $PUBLIC_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LIVE" != "${{ env.COMMIT }}" ]; then
            echo "::error::线上版本是 $LIVE，不是本次的 ${{ env.COMMIT }}"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **版本不一致 —— 本次改动没有生效**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ 线上版本与本次构建一致" >> "$GITHUB_STEP_SUMMARY"

      - name: 清理凭据
        # ★ always()：前面任何一步失败都要清。
        #   runner 是一次性的，但显式清掉是习惯问题 —— 哪天换成
        #   self-hosted runner，忘了清就是把私钥留在了别人机器上。
        if: always()
        run: rm -f ~/.ssh/devbox
