name: Deploy to Sealos DevBox

# 手动触发：GitHub → Actions → Deploy to Sealos DevBox → Run workflow
#
# ★ 只有 workflow_dispatch，没有 push 触发 —— 部署是【决定】不是【副作用】。
#   自动部署 main 意味着任何一次手滑推送都会直接进生产。
#
# ★★ 本 workflow 不构建任何东西，只发一条 ssh 命令。
#
#    最初的版本在这里打包再 scp 过去，实测跨境速率 8 KB/s：
#    130 MB 的 fat jar 要传 4 个多小时，而 workflow 超时是 25 分钟。
#    GitHub 的 runner 在美欧、Sealos 在北京，这条链路就是这个量级 ——
#    不是配置问题，加多少重试都没用。
#
#    改成 DevBox 自己构建之后，跨境的只剩这条 ssh 命令（几 KB）：
#      源码 DevBox 自己从 GitHub 拉    1.2 MB
#      Maven 依赖走阿里云               实测 20 MB/s
#      npm 依赖走 npmmirror             境内
#
# ★ 本 workflow 从不接触数据库口令 / JWT_SECRET。
#   那些值只存在于 DevBox 上的 /home/devbox/app/.env。
#   GitHub 这边只有一把 SSH 私钥 —— 泄露的爆炸半径小得多。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支（默认 main）'
        required: false
        default: 'main'

# ★ 同一时间只允许一个部署在跑。
#   两个并行会互相覆盖 jar，且回滚逻辑会拿到错的"上一版"。
concurrency:
  group: deploy-devbox
  cancel-in-progress: false

jobs:
  deploy:
    name: 在 DevBox 上构建并部署
    runs-on: ubuntu-latest
    # ★ 构建在 DevBox 上（2C/4G），比 runner 慢。首次拉依赖更久。
    timeout-minutes: 30

    steps:
      # 仓库是私有的，但 Actions 自带的 GITHUB_TOKEN 有读权限，checkout 照常可用。
      # ★ 这一步是 rsync 的数据来源 —— 没有它 runner 上是空目录，
      #   rsync --delete 会把 DevBox 上的源码【全部删光】。
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ★ 环境变量一律用 DEVBOX_ 前缀。
      #   写成 USER / HOST / PORT 的话，USER 会覆盖 runner 上的标准 USER 变量 ——
      #   覆盖本身能工作，但任何子进程读 $USER 拿到的都是远端用户名，
      #   这类污染出问题时极难联想到是 workflow 改的。
      - name: 配置 SSH
        env:
          DEVBOX_SSH_KEY: ${{ secrets.DEVBOX_SSH_KEY }}
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_KNOWN_HOSTS: ${{ secrets.DEVBOX_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOX_SSH_KEY:-}" ] || [ -z "${DEVBOX_HOST:-}" ]; then
            echo "::error::缺少 DEVBOX_SSH_KEY 或 DEVBOX_HOST secret，见 deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVBOX_SSH_KEY" > ~/.ssh/devbox
          chmod 600 ~/.ssh/devbox

          if [ -n "${DEVBOX_KNOWN_HOSTS:-}" ]; then
            # ★ 首选：主机公钥固定在 secret 里，能防中间人
            printf '%s\n' "$DEVBOX_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "使用固定的 known_hosts"
          else
            # 退路：每次现扫。方便，但无法验证对方身份 ——
            # 有人劫持了 DNS 或网络，私钥就直接送到对方手里了。
            ssh-keyscan -p "${DEVBOX_PORT:-22}" -H "$DEVBOX_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::未设置 DEVBOX_KNOWN_HOSTS，本次现扫主机公钥（无法防中间人）"
            echo "把下面这些行存成 DEVBOX_KNOWN_HOSTS secret 即可固定："
            cat ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      # ★★ 源码由本 workflow 推给 DevBox，DevBox 不再自己去 GitHub 拉。
      #
      #    仓库转私有之后 DevBox 匿名 clone 失败（could not read Username）。
      #    可以给它配 deploy key，但那需要在 GitHub 上加一把公钥；
      #    这里选择让 Actions 直接把源码送过去 —— Actions 本来就有仓库读权限。
      #
      #    ★ 用 rsync 不用 scp+tar：
      #      - 增量。首次 0.59 MB，之后每次只传改动的几 KB
      #        （跨境链路实测 8 KB/s，每一 KB 都算数）
      #      - --delete 能把仓库里已删除的文件同步删掉。
      #        scp 覆盖式传输做不到这点，会留下"仓库里明明删了却还在编译"的幽灵文件
      #      - 被 --exclude 的路径不会被 --delete 删除，所以 node_modules
      #        和 target 这两个构建缓存能留下来（重装一次要多花好几分钟）
      #
      #    ★ 同步在 build.sh 被调用【之前】完成，所以对 build.sh 自身的修改
      #      当次就生效。早先 build.sh 自己拉代码再执行刚被覆盖的自己，
      #      对它自身的改动永远晚一个版本生效，而且完全静默 —— 踩过一次。
      - name: 推送源码到 DevBox
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          # ★ --delete 的保险丝。checkout 失败或路径不对时 runner 上会是空目录，
          #   那样 rsync --delete 会把 DevBox 上的源码全部删光 ——
          #   下一步构建才报错，而报错内容是"找不到 pom.xml"，
          #   完全看不出真实原因是同步把远端清空了。
          test -f backend/pom.xml && test -f portal/package.json \
            || { echo "::error::runner 上没有源码，中止（避免 rsync --delete 清空远端）"; exit 1; }

          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='backend/src/main/resources/static' \
            -e "ssh -i ~/.ssh/devbox -p ${DEVBOX_PORT:-22}" \
            ./ "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}:/home/devbox/app/src/"
          echo "源码已同步"

      - name: 在 DevBox 上构建并部署
        env:
          DEVBOX_HOST: ${{ secrets.DEVBOX_HOST }}
          DEVBOX_PORT: ${{ secrets.DEVBOX_PORT }}
          DEVBOX_USER: ${{ secrets.DEVBOX_USER }}
        run: |
          set -euo pipefail
          # ★ commit 从这里传进去。DevBox 上已经没有 .git，
          #   build.sh 无法自己读 —— 而留一个过时的 .git 让它读到错误的 commit，
          #   比返回 unknown 危险得多。
          COMMIT="$(echo '${{ github.sha }}' | cut -c1-7)"
          # -tt 强制分配伪终端，这样远端脚本的输出能实时回流到 Actions 日志，
          # 而不是攒到结束才一次性吐出来 —— 构建要几分钟，中途看不到进度很难受。
          ssh -tt -i ~/.ssh/devbox -p "${DEVBOX_PORT:-22}" \
            "${DEVBOX_USER:-devbox}@${DEVBOX_HOST}" \
            "MFG_COMMIT='$COMMIT' bash /home/devbox/app/src/deploy/devbox/build.sh"

      - name: 清理凭据
        # ★ always()：前面任何一步失败都要清。
        #   runner 是一次性的，但显式清掉是习惯问题 —— 哪天换成
        #   self-hosted runner，忘了清就是把私钥留在了别人机器上。
        if: always()
        run: rm -f ~/.ssh/devbox
