name: Code Quality

# 镜像 .githooks/pre-commit 的四道闸门 —— 有人用了 --no-verify、
# 或者没跑过 scripts/setup-hooks.sh，在这里兜住。
#
# 本 workflow 和本地 hook 共用同一批 scripts/check-*.py ——
# 三处（脚本 / hook / workflow）必须同步修改。
#
# ★ 密钥扫描和冲突标记检查【没有 paths 过滤】——
#   密钥可以出现在任何文件，加路径过滤等于把自己眼睛蒙上。

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  # ---- 无路径过滤的闸门：任何文件都要扫 ----
  secrets-and-markers:
    name: 密钥 / 冲突标记
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要 base 和 head 都可达才能 diff

      - name: 计算 diff 范围
        id: range
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          # 强推 / 新建分支时 before 是全零，回落到 head 的第一个父提交
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse "$HEAD^")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: 密钥扫描
        run: python3 scripts/check-committed-secrets.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: 遗留冲突标记
        run: python3 scripts/check-conflict-markers.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

  # ---- 后端相关的闸门 ----
  backend-gates:
    name: 迁移文件名 / Java 非 ASCII 字面量
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算 diff 范围
        id: range
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse "$HEAD^")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: 迁移文件名
        run: python3 scripts/check-migration-filename.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Java 非 ASCII 字符串字面量
        run: python3 scripts/check-non-ascii-literals.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

  # ---- 编译 + 单测 ----
  backend-test:
    name: 后端编译 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -B test

  # ---- 集成测试：真 PostgreSQL + 真 Redis ----
  # ★ 绝不用 mock 替代（CLAUDE.md §10）——
  #   缓存命中路径正是 bug 藏身之处，mock 掉等于 CI 全绿着上线炸
  backend-it:
    name: 后端集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mfg_test
          POSTGRES_USER: mfg
          POSTGRES_PASSWORD: mfg
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: mvn verify
        working-directory: backend
        env:
          TEST_DB_USERNAME: mfg
          TEST_DB_PASSWORD: mfg
        run: mvn -B verify

  # ---- 迁移回归：用真实迁移文件从零建库 ----
  # 平时的 IT 用 ddl-auto=create-drop 建表（快），
  # 这个 job 保证迁移文件本身也是对的 —— 两者必须都跑
  migration-regression:
    name: 迁移文件从零建库
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mfg_migrate
          POSTGRES_USER: mfg
          POSTGRES_PASSWORD: mfg
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 按字典序依次应用全部迁移
        env:
          PGPASSWORD: mfg
        run: |
          set -e
          for f in $(ls database/migrations/*.sql | sort); do
            echo "--- $f"
            psql -h localhost -U mfg -d mfg_migrate -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: 幂等性检查（再跑一遍必须全过）
        env:
          PGPASSWORD: mfg
        run: |
          set -e
          for f in $(ls database/migrations/*.sql | sort); do
            psql -h localhost -U mfg -d mfg_migrate -v ON_ERROR_STOP=1 -f "$f"
          done

  frontend:
    name: 前端类型检查 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - working-directory: portal
        run: npm ci
      - working-directory: portal
        run: npm run type-check
      - working-directory: portal
        run: npm test
