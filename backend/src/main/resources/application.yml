server:
  # 本地 3001；容器里由 SERVER_PORT 覆盖（Sealos DevBox 对外暴露 8080）。
  # ★ 不要写死 —— 换个托管平台就是换个端口，而端口错了的表现是
  #   "容器起来了但访问不通"，日志里一切正常，最容易怀疑到别的地方去。
  port: ${SERVER_PORT:3001}

  shutdown: graceful

spring:
  application:
    name: mfg-backend

  lifecycle:
    # 收到 SIGTERM 后先停止接收新请求，给在途请求 20 秒收尾。
    # 滚动更新时没有这个，正在提交的报价会直接连接中断。
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mfg}
    username: ${DB_USERNAME:mfg}
    password: ${DB_PASSWORD:}          # 本地放 application-local.yml，部署走环境变量 / Secret Manager
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000

  jpa:
    # ★ validate，永远不是 update / create。schema 由 database/migrations/ 管理，
    #   Hibernate 从不写 DDL。所有环境一致，没有例外（CLAUDE.md §6）。
    hibernate:
      ddl-auto: validate
    open-in-view: false               # 关掉，否则懒加载会在视图层偷偷发查询
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # 自定义 @Query 里的 UUID 参数绑定需要这个，否则运行时报类型不匹配
        type.preferred_uuid_jdbc_type: VARCHAR
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000

  jackson:
    # ★ camelCase 到底，不做任何大小写转换（CLAUDE.md §11 C1）
    #   数据库列名的 snake_case 由 JPA @Column 映射，仅此一处转换
    default-property-inclusion: non_null
    serialization:
      # ★ Jackson 3（Boot 4）里 WRITE_DATES_AS_TIMESTAMPS 这个开关已经取消 ——
      #   日期默认就是 ISO-8601 字符串，正是 §4 要的（后端返带时区的 ISO 8601）。
      #   还写着它会导致启动失败：No enum constant SerializationFeature.write-dates-as-timestamps
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      # ★ 整数字段收到 1.5 时报 400，而不是静默截成 1 —— 数量要拿去算钱和排产（2026-09-15 测出来的）
      accept-float-as-int: false

  servlet:
    multipart:
      # 用户上传走直传对象存储，后端不碰字节。
      # 这里的限制只针对服务端解析类上传（CSV 导入、后台小文件）
      max-file-size: 20MB
      max-request-size: 25MB

  # ---------- AI（Spring AI 的 OpenAI 兼容 client → Sealos aiproxy）----------
  # ★ 业务只依赖 AiService；这里是它底层的装配。
  # ★ api-key 走环境变量，绝不写进代码/仓库。没配时用占位符让上下文能启动，
  #   真正调 AI 才会因假 key 失败（本地/CI 不调 AI 就不受影响）。
  ai:
    openai:
      base-url: ${SEALOS_AI_BASE_URL:https://aiproxy.bja.sealos.run}
      api-key: ${SEALOS_AI_API_KEY:not-configured}
      chat:
        options:
          model: ${SEALOS_AI_MODEL:deepseek-chat}
          temperature: 0.2
    # 关掉对不需要的模型类型的自动装配探测，避免多余告警
    embedding:
      openai:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # + Prometheus 抓取端点
  endpoint:
    health:
      show-details: never             # 不对外暴露依赖详情
      probes:
        enabled: true                 # 拆出 /health/liveness 与 /health/readiness（k8s 探针）
  prometheus:
    metrics:
      export:
        enabled: true
  # 公共标签由 MetricsConfig 加（application / environment），便于多环境区分

app:
  # ★ 全局 API 前缀。在 MVC 层生效，不是 Tomcat context-path。
  #   任何做路径匹配的地方都从这里读，代码里绝不硬编码（CLAUDE.md §11 C5）
  api:
    prefix: /api/v1

  web:
    # 分页封顶：全局统一,防 pageSize=1000000 拖库。内外之分由路径层(端级闸门)管,不进这里。
    page:
      default-size: ${PAGE_DEFAULT_SIZE:20}
      max-size: ${PAGE_MAX_SIZE:200}

  jwt:
    secret: ${JWT_SECRET:}            # 必填，至少 32 字节；启动时校验，太短直接起不来
    access-token-ttl-seconds: 7200
    refresh-token-ttl-seconds: 2592000

  auth:
    login:
      # 登录限流：同一 (受众+账号) 窗口内的尝试上限，防爆破（RateLimiter）
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_WINDOW_SECONDS:300}

  dispatch:
    # ★ 7 天是需求方定的业务规则（2026-09-20：供应商接单后 7 天不签字，自动取消、回待派），不是工程取值。
    #   扫描间隔才是工程取值。
    sign-timeout-days: ${SIGN_TIMEOUT_DAYS:7}
    sign-timeout-scan-enabled: ${SIGN_TIMEOUT_SCAN_ENABLED:true}
    sign-timeout-initial-delay: PT2M
    sign-timeout-interval: PT1H

  cache:
    key-prefix: "mfg:"
    default-ttl-seconds: 300

  schema-migrations:
    enabled: true
    fail-on-drift: true               # 已应用文件被改过 → 启动失败

  storage:
    # ★ 存储位置全部走配置 —— 将来若欧洲客户要求数据驻留，
    #   拆区靠改配置而不是改业务代码（设计文档 D1）
    provider: ${STORAGE_PROVIDER:s3}   # s3 | memory（memory 仅本地/测试）
    signed-url-ttl-seconds: 900       # 15 分钟。图纸签名 URL 要短
    # 允许上传的类型，按 magic bytes 校验（不信扩展名）。清单出处：设计文档 2 §5.2。
    # ★ 文档那句清单的结尾还有「常见图片」，这里没有 —— 客户拍的照片/截图会被拒收。
    #   这是没人拍过板的收窄，用之前先确认要不要把图片加回来。
    allowed-drawing-types: STEP,STP,IGES,IGS,X_T,SLDPRT,DWG,DXF,PDF,ZIP
    # 不设单文件大小上限 —— 2026-09-10 需求方拍板「不卡大小」。字节直传桶，不经过应用。
    s3:
      # ★ endpoint 是【内网】地址（服务端 put/get 走它，不出集群）；
      #   public-endpoint 是【外网】地址，给浏览器用的签名 URL 走它（见 StorageConfig）。
      #   不填 public-endpoint 时回落到 endpoint（本地开发两者同一个外网地址）。
      endpoint: ${STORAGE_S3_ENDPOINT:}
      public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style: ${STORAGE_S3_PATH_STYLE:true}   # MinIO / Sealos 必须为 true

  # ---------- 线程池（见 config/AsyncConfig） ----------
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}
    await-termination-seconds: 20     # 和 server.shutdown: graceful 对齐
  scheduler:
    pool-size: ${SCHEDULER_POOL_SIZE:2}

  # ---------- 汇率（platform/fx）----------
  # 每天从欧洲央行（ECB）拉参考汇率入库 —— 2026-09-17 需求方决定先接这个免费源，只存不换算。
  # ★ ECB 声明这是参考汇率、不建议直接用于交易；实测和中国银行现汇买入价差约 1%。
  # ★ 下面的超时和间隔是工程取值（数据每天只变一次，ECB 工作日约 16:00 CET 更新），不是业务政策。
  fx:
    enabled: ${FX_SYNC_ENABLED:true}
    ecb-daily-url: ${FX_ECB_DAILY_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
    connect-timeout-seconds: 10
    request-timeout-seconds: 20
    sync-initial-delay: PT1M     # 开机后多久拉第一次
    sync-interval: PT3H          # 之后每隔多久拉一次（同一天重复拉只会跳过）

  quote:
    # ★ 本节目前【没有任何代码读它】。报价域一开工，写代码的人会把这里当成已拍板的输入 ——
    #   所以只留有出处的，没出处的一律不留占位数字。
    default-validity-days: 15         # 设计文档 5 Q6：「15 天。做成可配置」
    approval:
      # 设计文档 11 D14【已拍板】：先做最简版 —— 毛利为负硬阻断 + 单人审批。
      block-negative-margin: true
      # ★ 这里原本还有 second-approver-amount-threshold: 20000（EUR）
      #   和 second-approver-margin-threshold: 0.12，2026-09-09 删掉了。
      #   两个数字都是编的：D14 原话是「金额分档、第二人复核【后面再加】」，
      #   文档 5 Q7 至今写着「待你给具体数字」。留着会被当成"二次审批线已定"。
    # ★ 汇率 buffer 分档表原本写了 7天→1.0% / 15天→2.0% / 30天→3.0%，一并删掉。
    #   分档【结构】有出处（文档 3 护栏 4：「做成有效期天数 → buffer% 的分档表」），
    #   但三个档位边界是编的，而且 7 天档的 1.0% 还低于文档建议的 2–3%。
    #   要用先定数值，别拿这三个凑数 —— 它直接进报价成本，客户实付。

  notification:
    email:
      enabled: true
      from: ${MAIL_FROM:}
    wechat:
      # ★ 供应商侧通知的主通道 —— 只发邮件他们不会看（设计文档 1 §3.5）
      enabled: ${WECHAT_ENABLED:false}
      corp-id: ${WECHAT_CORP_ID:}
      corp-secret: ${WECHAT_CORP_SECRET:}

logging:
  level:
    root: INFO
    com.mfg: INFO
    # 排查 SQL 时临时打开，不要留在生产配置里
    org.hibernate.SQL: WARN
  pattern:
    # ★ 每行日志带上请求 traceId（由 RequestTraceFilter 塞进 MDC）。
    #   Spring Boot 会把这个片段注进控制台和文件两套默认 pattern 里。
    #   一个请求跨多行日志、并发交织时，靠这个 id 把它们串起来。
    correlation: "[%X{traceId:-} %X{userId:-} %X{portal:-}] "
  file:
    # ★ 配了这个才有【文件 + 自动轮转】。LOG_PATH 由 deploy.sh 传绝对路径；
    #   本地开发不传 → 落进当前目录的 logs/（已 gitignore）。
    #   没有它就只有 stdout，DevBox 靠 shell 重定向成一个永不切割的大文件（磁盘迟早满）。
    name: ${LOG_PATH:logs}/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB       # 单个文件到 50MB 就切
      max-history: 14           # 保留 14 天，更早的自动删
      total-size-cap: 2GB       # 所有归档合计上限，超了从最旧的删
