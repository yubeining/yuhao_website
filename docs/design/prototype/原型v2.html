<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>融一智造 · 跨境制造平台</title>
<style>
:root{
  --app:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --panel-3:#EDF1F5;
  --ink:#111721; --ink-2:#37414E; --muted:#657286; --faint:#94A0AF;
  --line:#E1E6EC; --line-2:#CDD5DE;
  --acc:#14568F; --acc-hi:#1A6BB0; --acc-ink:#0F4573; --acc-wash:#E9F0F7; --acc-line:#B3CCE3;
  --ok:#1A7A3E;   --ok-wash:#E5F3E9;  --ok-line:#AFD9BE;
  --warn:#98590A; --warn-wash:#FAF0DE; --warn-line:#E8C994;
  --bad:#A62D22;  --bad-wash:#FAE9E7; --bad-line:#EDB8B2;
  --neu-wash:#EDF0F4; --neu-line:#D8DFE7;
  --deep:#111A26; --deep-2:#1A2634; --deep-ink:#DFE6EF; --deep-mut:#8494A6; --deep-line:#26333F;
  --sh-1:0 1px 2px rgba(15,25,40,.05);
  --sh-2:0 2px 10px rgba(15,25,40,.08),0 1px 3px rgba(15,25,40,.05);
  --sh-3:0 20px 48px rgba(15,25,40,.16);
  --r1:5px; --r2:8px; --r3:12px; --r4:16px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --app:#0A0F16; --panel:#141B24; --panel-2:#1A222D; --panel-3:#101821;
    --ink:#E8EDF4; --ink-2:#BCC7D4; --muted:#8B98A9; --faint:#6A7787;
    --line:#26303C; --line-2:#37434F;
    --acc:#4E9AD8; --acc-hi:#6FB0E5; --acc-ink:#9CC6EC; --acc-wash:#12283D; --acc-line:#2A4B6C;
    --ok:#54BE79;   --ok-wash:#12281B;  --ok-line:#2B4F36;
    --warn:#D89B3C; --warn-wash:#2A2012; --warn-line:#543F1B;
    --bad:#E2756A;  --bad-wash:#2A1614; --bad-line:#532E28;
    --neu-wash:#1A222D; --neu-line:#2F3A47;
    --deep:#080D13; --deep-2:#111A24; --deep-ink:#D9E1EA; --deep-mut:#7C8A9B; --deep-line:#1D2833;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 12px rgba(0,0,0,.5); --sh-3:0 22px 56px rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  --app:#0A0F16; --panel:#141B24; --panel-2:#1A222D; --panel-3:#101821;
  --ink:#E8EDF4; --ink-2:#BCC7D4; --muted:#8B98A9; --faint:#6A7787;
  --line:#26303C; --line-2:#37434F;
  --acc:#4E9AD8; --acc-hi:#6FB0E5; --acc-ink:#9CC6EC; --acc-wash:#12283D; --acc-line:#2A4B6C;
  --ok:#54BE79;   --ok-wash:#12281B;  --ok-line:#2B4F36;
  --warn:#D89B3C; --warn-wash:#2A2012; --warn-line:#543F1B;
  --bad:#E2756A;  --bad-wash:#2A1614; --bad-line:#532E28;
  --neu-wash:#1A222D; --neu-line:#2F3A47;
  --deep:#080D13; --deep-2:#111A24; --deep-ink:#D9E1EA; --deep-mut:#7C8A9B; --deep-line:#1D2833;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 12px rgba(0,0,0,.5); --sh-3:0 22px 56px rgba(0,0,0,.62);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;}
body{background:var(--app);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;}
button{cursor:pointer;}
a{color:var(--acc-ink);text-decoration:none;}
a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1);}
#screen{animation:fade .26s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* 右下角重置（演示用，唯一的非产品元素） */

/* ═══════════════════════════════ 登录 / 注册 */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}
@media (max-width:900px){.auth{grid-template-columns:1fr;} .auth .brandside{display:none;}}
.brandside{background:var(--deep);color:var(--deep-ink);padding:48px 54px;display:flex;
  flex-direction:column;position:relative;overflow:hidden;}
.brandside::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 55% at 12% 8%, rgba(78,154,216,.16), transparent 70%);}
.brandside > *{position:relative;z-index:1;}
.bmark{display:flex;align-items:center;gap:11px;margin-bottom:52px;}
.gl svg{width:66%;height:66%;display:block;}
.bmark .gl{width:34px;height:34px;border-radius:var(--r2);background:var(--acc-hi);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700;}
.bmark .nm{font-size:15.5px;font-weight:650;color:#fff;}
.bmark .sb{font-size:11px;color:var(--deep-mut);letter-spacing:.06em;}
.bflow{margin:auto 0;}
.bflow svg{width:100%;max-width:530px;height:auto;display:block;font-family:var(--sans);}
.bflow .ln{fill:none;stroke:var(--deep-line);stroke-width:1.5;}
.bflow .nd{fill:var(--deep);stroke:var(--acc-hi);stroke-width:2;}
.bflow .st{fill:#fff;font-size:25px;font-weight:650;letter-spacing:-.01em;}
.bflow .cp{fill:var(--deep-mut);font-size:13px;}
.orline{display:flex;align-items:center;gap:12px;margin:16px 0 12px;font-size:12px;color:var(--faint);}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line);}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:var(--r2);
  padding:10px;font-size:13.5px;font-weight:550;
  transition:background .14s,border-color .14s;}
.oauth:hover{background:var(--panel-3);border-color:var(--muted);}
.oauth svg{width:18px;height:18px;flex:none;}

.formside{display:flex;align-items:center;justify-content:center;padding:32px;
  background:var(--panel);position:relative;}
.langbtn{position:absolute;top:22px;right:26px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);
  font-size:12.5px;font-weight:650;display:grid;place-items:center;
  transition:background .14s,border-color .14s;}
.langbtn:hover{background:var(--panel-3);border-color:var(--muted);color:var(--ink);}
.f2row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.oauths{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.formwrap{width:100%;max-width:392px;}
.fh{font-size:24px;font-weight:650;letter-spacing:-.015em;margin:0;}
.fsub{font-size:13.5px;color:var(--muted);margin-top:7px;}
.field2{margin-top:15px;}
.field2 label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.inp{width:100%;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  border-radius:var(--r2);padding:10px 13px;font-size:14px;transition:border-color .15s,box-shadow .15s;}
.inp::placeholder{color:var(--faint);}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-wash);}
.inp.bad{border-color:var(--bad);}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.errmsg{margin-top:11px;border:1px solid var(--bad-line);background:var(--bad-wash);color:var(--bad);
  border-radius:var(--r2);padding:9px 12px;font-size:12.5px;line-height:1.55;}
.inprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;
  font-size:13px;color:var(--muted);}
.inprow label{display:flex;align-items:center;gap:7px;cursor:pointer;}
.bigbtn{width:100%;margin-top:18px;background:var(--acc);border:1px solid var(--acc);color:#fff;
  border-radius:var(--r2);padding:11px;font-size:15px;font-weight:650;
  transition:background .15s,transform .05s;}
.bigbtn:hover{background:var(--acc-hi);}
.bigbtn:active{transform:translateY(1px);}
.hr{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--faint);font-size:12px;}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--line);}
.demo{border:1px dashed var(--line-2);border-radius:var(--r2);padding:11px 12px;
  background:var(--panel-2);margin-top:16px;}
.demo .dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px;}
.demo .row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.demo .acc{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;
  border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:9px 6px;
  transition:border-color .14s,background .14s;}
.demo .acc:hover{border-color:var(--acc-line);background:var(--acc-wash);}
.demo .acc .av{width:26px;height:26px;border-radius:50%;flex:none;background:var(--panel-3);
  color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:650;}
.demo .acc .a1{font-size:11.5px;font-weight:600;line-height:1.3;text-align:center;}
.demo .acc .a2{font-size:11px;color:var(--faint);font-family:var(--mono);}
.fnote{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}
@media (max-height:760px){
  .formside{padding:20px 32px;}
  .field2{margin-top:11px;} .bigbtn{margin-top:13px;padding:10px;}
  .orline{margin:12px 0 9px;} .demo{margin-top:12px;padding:9px 10px;}
  .fnote{margin-top:10px;} .bmark{margin-bottom:24px;}
}


.page{max-width:1200px;margin:0 auto;padding:26px 24px 56px;}
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.hello h1{margin:0;font-size:25px;font-weight:650;letter-spacing:-.02em;}
.hello .hs{font-size:13.5px;color:var(--muted);margin-top:5px;}
.hello .sp{flex:1;}

/* 行动卡 */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:22px;}
.actcard{border:1px solid var(--line);border-radius:var(--r3);background:var(--panel);
  box-shadow:var(--sh-1);padding:19px 21px;display:flex;flex-direction:column;gap:11px;
  border-left:3px solid var(--acc);}
.actcard.warn{border-left-color:var(--warn);}
.actcard .ah{display:flex;align-items:center;gap:9px;}
.actcard .at{font-size:15px;font-weight:650;}
.actcard .sp{flex:1;}
.actcard .ad{font-size:13px;color:var(--muted);line-height:1.62;}
.actcard .af{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap;}
.actcard .amt2{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;
  letter-spacing:-.02em;}

/* 通用卡 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh-1);overflow:hidden;}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 19px;
  border-bottom:1px solid var(--line);}
.chead h2{margin:0;font-size:14.5px;font-weight:650;}
.chead .rid{font-family:var(--mono);font-size:12px;color:var(--muted);}
.chead .sp{flex:1;}
.cbody{padding:19px;}
.cbody.flush{padding:0;}
.cfoot{padding:13px 19px;border-top:1px solid var(--line);background:var(--panel-2);
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.cfoot .sp{flex:1;}
.cols{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px;align-items:start;}
@media (max-width:960px){.cols{grid-template-columns:1fr;}}
.stack{display:flex;flex-direction:column;gap:18px;}

.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:2px 9px;border-radius:20px;
  font-size:11.5px;font-weight:600;line-height:1.75;border:1px solid transparent;}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;}
.pill.nd::before{display:none;}
.pill.ok{background:var(--ok-wash);color:var(--ok);border-color:var(--ok-line);}
.pill.wa{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line);}
.pill.ba{background:var(--bad-wash);color:var(--bad);border-color:var(--bad-line);}
.pill.in{background:var(--acc-wash);color:var(--acc-ink);border-color:var(--acc-line);}
.pill.ne{background:var(--neu-wash);color:var(--muted);border-color:var(--neu-line);}

.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:var(--r2);
  padding:8px 16px;font-size:13.5px;font-weight:550;transition:background .14s,border-color .14s,transform .05s;}
.btn:hover{background:var(--panel-3);}
.btn:active{transform:translateY(1px);}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
.btn.pri:hover{background:var(--acc-hi);border-color:var(--acc-hi);}
.btn.sm{padding:5px 11px;font-size:12.5px;}
.btn.qui{border-color:transparent;background:transparent;color:var(--acc-ink);padding:5px 9px;}
.btn.qui:hover{background:var(--acc-wash);}

.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding:10px 17px;border-bottom:1px solid var(--line);
  background:var(--panel-2);}
td{padding:12px 17px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr.clk{cursor:pointer;transition:background .12s;}
tbody tr.clk:hover{background:var(--panel-2);}
tbody tr.dim td{opacity:.55;}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
td .m{font-family:var(--mono);font-size:12.5px;}
td .t1{font-weight:600;}
td .t2{font-size:12px;color:var(--faint);margin-top:1px;}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 22px;}
.fld .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:3px;}
.fld .v{font-size:14px;}
.fld .v.m{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;}

.bar{height:7px;border-radius:4px;background:var(--panel-3);overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--acc);border-radius:4px;}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;}
.barlab b{color:var(--ink);font-family:var(--mono);font-weight:650;}

.tl{display:flex;flex-direction:column;}
.tlr{display:grid;grid-template-columns:18px 1fr;gap:13px;}
.tlg{display:flex;flex-direction:column;align-items:center;}
.tln{width:9px;height:9px;border-radius:50%;margin-top:6px;border:2px solid var(--line-2);
  background:var(--panel);flex:none;}
.tll{width:2px;flex:1;background:var(--line);min-height:20px;}
.tlr.dn .tln{background:var(--acc);border-color:var(--acc);}
.tlr.dn .tll{background:var(--acc-line);}
.tlr.hr2 .tln{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-wash);}
.tlb{padding-bottom:16px;}
.tlr:last-child .tlb{padding-bottom:0;}
.tlt{font-size:13px;font-weight:600;}
.tlr:not(.dn):not(.hr2) .tlt{color:var(--faint);font-weight:500;}
.tlm{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}

.contact{display:flex;align-items:center;gap:13px;}
.contact .av2{width:44px;height:44px;border-radius:50%;flex:none;background:var(--acc-wash);
  color:var(--acc-ink);border:1px solid var(--acc-line);display:grid;place-items:center;
  font-size:16px;font-weight:650;}
.contact .cn{font-size:14.5px;font-weight:650;}
.contact .cr{font-size:12.5px;color:var(--muted);}
.contact .cm{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:3px;}

.msgs{display:flex;flex-direction:column;gap:11px;}
.msg{display:flex;gap:9px;}
.msg .ma{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:650;background:var(--panel-3);color:var(--muted);}
.msg .mb{border:1px solid var(--line);border-radius:var(--r2);padding:8px 11px;background:var(--panel-2);}
.msg .mn{font-size:11px;color:var(--faint);margin-bottom:2px;}
.msg .mx{font-size:12.5px;line-height:1.58;}
.msg.me{flex-direction:row-reverse;}
.msg.me .ma{background:var(--acc-wash);color:var(--acc-ink);}
.msg.me .mb{background:var(--acc-wash);border-color:var(--acc-line);}
.msg.me .mn{text-align:right;}

.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.titem{display:flex;gap:10px;align-items:flex-start;}
.titem .tk{color:var(--ok);font-weight:700;flex:none;line-height:1.5;}
.titem .s1{font-size:13px;font-weight:600;}
.titem .s2{font-size:11.5px;color:var(--muted);line-height:1.5;}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;}
.ptile{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--panel-2);cursor:zoom-in;}
.ptile:hover{border-color:var(--acc-line);}
.ptile .im{aspect-ratio:4/3;display:grid;place-items:center;color:var(--faint);
  background:linear-gradient(155deg,var(--panel-3),var(--panel-2));border-bottom:1px solid var(--line);}
.ptile .im svg{width:74%;height:74%;}
.ptile .cp{padding:6px 9px;}
.ptile .c1{font-size:11.5px;font-weight:600;line-height:1.3;}
.ptile .c2{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:1px;}

.empty{text-align:center;padding:46px 20px;color:var(--muted);}
.empty .mk2{width:40px;height:40px;margin:0 auto 12px;border-radius:50%;border:1.5px dashed var(--line-2);
  display:grid;place-items:center;color:var(--faint);font-family:var(--mono);font-size:15px;}
.empty p{margin:0;font-size:13.5px;}
.empty .s2{font-size:12.5px;color:var(--faint);margin-top:4px;}
.sect-t{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px;}
.ban{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r2);padding:12px 15px;
  font-size:13px;line-height:1.62;border:1px solid transparent;}
.ban .bi{font-family:var(--mono);font-weight:700;flex:none;}
.ban.in{background:var(--acc-wash);border-color:var(--acc-line);color:var(--acc-ink);}
.ban.wa{background:var(--warn-wash);border-color:var(--warn-line);color:var(--warn);}
.ban.ok{background:var(--ok-wash);border-color:var(--ok-line);color:var(--ok);}

/* ═══════════════════════════════ 应用外壳（三端共用 · 左深右浅） */
.appshell{display:flex;flex:1;min-height:0;}
.appnav{width:222px;flex:none;background:var(--deep);border-right:1px solid var(--deep-line);
  display:flex;flex-direction:column;padding:10px 0 12px;overflow-y:auto;}
.appnav .sec{padding:13px 18px 5px;font-size:10.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--deep-mut);opacity:.8;}
.appnav .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
  text-align:left;padding:8px 18px;font-size:13.5px;color:var(--deep-mut);
  border-left:2px solid transparent;}
.appnav .it .ic{width:15px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;opacity:.75;}
.appnav .it .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;
  background:rgba(255,255,255,.09);color:var(--deep-ink);border-radius:9px;padding:1px 6px;}

<div id="app"></div>

<script>
const LOGO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5.6 4.6h8.2l4.6 4.6v10.2H5.6z"/><path d="M13.8 4.6v4.6h4.6"/><circle cx="11.4" cy="13.4" r="3.1"/></svg>`;

/* ═══════════════════════════════════════════════════════════ 数据 */
const PART_SVG = [
  `<rect x="20" y="32" width="120" height="56" rx="8"/><circle cx="55" cy="60" r="16"/>
   <circle cx="55" cy="60" r="8"/><circle cx="112" cy="60" r="10"/><path d="M55 44V28M112 50V26"/>`,
  `<circle cx="80" cy="60" r="33"/><circle cx="80" cy="60" r="13"/>
   <circle cx="80" cy="60" r="23" stroke-dasharray="4 5"/><path d="M80 27v-9M80 93v9M47 60h-9M113 60h9"/>`,
  `<path d="M30 46h100v28H30z"/><path d="M30 60h100M52 46v28M108 46v28"/><circle cx="80" cy="60" r="9"/>`,
  `<rect x="34" y="34" width="92" height="52" rx="6"/><path d="M34 52h92M60 34v52M100 34v52"/>
   <circle cx="47" cy="43" r="3"/><circle cx="113" cy="77" r="3"/>`
];
const thumb = i => `<svg viewBox="0 0 160 120" fill="none" stroke="currentColor" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round">${PART_SVG[i % PART_SVG.length]}</svg>`;

const RATES = [                    // 基准制造成本 ¥/件，按材料
  {mat:'材料 A', rate:100}, {mat:'材料 B', rate:100},
  {mat:'材料 C', rate:100}, {mat:'材料 D', rate:100}
];
const rateOf = m => (RATES.find(r=>r.mat===m) || {rate:100}).rate;
const MATS = () => RATES.map(r=>r.mat);
const SURF = ['无','表面处理 A','表面处理 B','表面处理 C'];

/* 基准成本（¥/件）→ 对客单价（€/件）/ 供应商目标价（¥/件） */
const baseCost = it => rateOf(it.mat);
const custUnit = it => +(baseCost(it) * (1 + T_.margin/100) / T_.fx).toFixed(2);
const supTarget = it => +(baseCost(it) * (1 + T_.spread/100)).toFixed(2);

/* ── 客户：询价 ───────────────────────────────────────────────────── */
newRfq(lines, files){

/* 上传文件 → 模拟解析：故意造出「需确认」和「阻断」两种行 */
parseFile(name){
  return [
    {no:fv('p1','零件 A'), rev:'A', mat:MATS()[0], qty:100, surf:SURF[1], s:'ok'},
    {no:'零件 B', rev:'B', mat:MATS()[1], qty:60,  surf:SURF[2], s:'ok'},
    {no:'零件 C', rev:'A', mat:'',        qty:40,  surf:SURF[0], s:'warn',
     raw:'材料别名', alt:[MATS()[2], MATS()[3]]},
    {no:'零件 D', rev:'',  mat:MATS()[0], qty:20,  surf:SURF[0], s:'bad'}
  ];
},
submitRfq(r){
  r.lines = r.lines.filter(l=>l.s!=='bad');
  r.status = 'quoting'; r.stage = 2;
  return A.makeQuote(r);
},
/* AI 即时报价（方案乙：先给客户价） */
makeQuote(r){
  const items = r.lines.map(l=>({...l, unit:custUnit(l), total:+(custUnit(l)*N(l.qty)).toFixed(2)}));
  const q = {id:nid('qt'), rfq:r.id, cid:r.cid, at:now(),
             items, total:+sum(items,i=>i.total).toFixed(2),
             lead:(r.want && r.want!==X ? r.want+' 天' : X), valid:plus(14), inco:'EXW 指定仓库',
             status:'open'};
  DB.quotes.push(q); r.stage = 3; r.quote = q.id;
  return q;
},

/* ── 客户：接受报价 → 产能确认期 + 拆包挂池 ─────────────────────── */
acceptQuote(q){
  q.status = 'accepted'; q.acceptedAt = now();
  const o = {id:nid('so'), quote:q.id, cid:q.cid, at:now(),
             eta:plus(45), status:'capacity', stage:0,
             items:q.items.map(i=>({...i, done:0, stage:0, ship:'随整单', st:'pending'}))};
  DB.orders.push(o);
  o.items.forEach((it,i)=>{
    DB.pkgs.push({id:nid('dp'), so:o.id, line:i, part:it.no, rev:it.rev, mat:it.mat,
      surf:it.surf, qty:N(it.qty), target:supTarget(it),
      total:+(supTarget(it)*N(it.qty)).toFixed(2),
      lead:q.lead, pay:`客户回款后 T+${T_.payDays}`, at:now(), exp:plus(1),
      status:'open', sup:null, watch:0});
  });
  return o;
},
/* ── 供应商：抢单 ─────────────────────────────────────────────────── */
grab(p){
  if(p.status !== 'open') return '这个派单包已经被抢走了';
  p.status = 'taken'; p.sup = CO().id; p.tookAt = now();
  const ct = {id:nid('ct'), pkg:p.id, sup:p.sup, at:now(),
              amount:p.total, status:'unsigned'};
  DB.contracts.push(ct); p.contract = ct.id;
  A.syncOrder(p.so);
  return null;
},
sign(ct){ ct.status = 'signed'; ct.signedAt = now(); A.syncOrder(pkgOf(ct).so); },
/* 所有包都抢到 → 产能确认通过，订单成立 */
syncOrder(soId){
  const o = DB.orders.find(x=>x.id===soId); if(!o) return;
  const ps = DB.pkgs.filter(p=>p.so===soId);
  ps.forEach(p=>{ o.items[p.line].st = p.status; });
  if(ps.every(p=>LOCKED(p.status)) && o.status==='capacity'){
    o.status = 'confirmed'; o.confirmedAt = now(); o.stage = 1;
  }
},
/* 超时无人抢 → 退回该行；其余行照常成单 */
dropLine(p){
  p.status = 'dropped';
  const o = DB.orders.find(x=>x.id===p.so);
  o.items[p.line].st = 'dropped';
  const live = DB.pkgs.filter(x=>x.so===p.so && x.status!=='dropped');
  if(live.length && live.every(x=>LOCKED(x.status)) && o.status==='capacity'){
    o.status = 'confirmed'; o.confirmedAt = now(); o.stage = 1;
  }
},
repost(p){ p.status='open'; p.target = +(p.target*1.05).toFixed(2);
           p.total = +(p.target*p.qty).toFixed(2); p.exp = plus(1); p.reprice=(p.reprice||0)+1;
           A.syncOrder(p.so); },
/* ── 生产上报 ─────────────────────────────────────────────────────── */
report(p, done){
  p.done = Math.min(N(done), p.qty);
  const o = DB.orders.find(x=>x.id===p.so);
  const it = o.items[p.line];
  it.done = p.done;
  it.stage = p.done>=p.qty ? 4 : p.done>0 ? 1 : 0;
  if(p.done>=p.qty) p.status = 'done';
  const all = DB.pkgs.filter(x=>x.so===o.id && x.status!=='dropped');
  o.stage = all.every(x=>x.status==='done') ? 3 : all.some(x=>x.done>0) ? 1 : o.stage;
},
deliver(o){ o.status='delivered'; o.stage=4; o.deliveredAt=now();
            DB.pkgs.filter(p=>p.so===o.id&&p.status==='done').forEach(p=>p.delivered=now()); },
custPaid(o){ o.paidAt = now(); },
uploadInvoice(p){
  DB.invoices.push({id:nid('inv'), pkg:p.id, sup:p.sup, no:fv('invno')||X,
                    at:now(), status:'checking'});
  p.invoice = true; clearF('invno');
},

function rfqNew(){
  if(!F.lines) F.lines = [{no:'',rev:'',mat:MATS()[0],qty:'',surf:SURF[0]}];
  const ls = F.lines.map(l=>({...l, s:lineStat(l)}));
  const bad = ls.filter(l=>l.s==='bad').length, warn = ls.filter(l=>l.s==='warn').length;
  const okn = ls.length - bad - warn;
  return `<div class="page">
    <div class="hello"><div>
      <button class="btn sm qui" data-sel="rfq:" style="margin:0 0 6px -9px">← 我的询价</button>
      <h1>提交新询价</h1></div></div>

    <div class="card" style="margin-bottom:16px"><div class="chead"><h2>上传清单</h2>
      <span class="sp"></span>
      <button class="btn sm" data-do="parse">选择文件并解析</button></div>

        <div class="d2">也可以直接在下面手工填写清单行</div></div></div>
    </div>

    ${F.err?`<div class="ban wa" style="margin-bottom:14px"><span class="bi">!</span>
      <div>${esc(F.err)}</div></div>`:''}
    <div class="card"><div class="chead"><h2>清单行</h2><span class="sp"></span>
      ${okn?`<span class="pill ok">${okn} 通过</span>`:''}
      ${warn?`<span class="pill wa">${warn} 需确认</span>`:''}
      ${bad?`<span class="pill ba">${bad} 阻断</span>`:''}</div>
      <div class="cbody flush"><div class="tw"><table>
        <thead><tr><th class="n">行</th><th>零件号</th><th>图纸版本</th><th>材料</th>
          <th class="n">数量</th><th>表面处理</th><th>状态</th><th></th></tr></thead>
        <tbody>${ls.map((l,i)=>`<tr class="${l.s==='bad'?'rowbad':l.s==='warn'?'rowwarn':''}">
          <td class="n">${i+1}</td>
          <td>${inp(`lines.${i}.no`,'零件号')}</td>
          <td>${inp(`lines.${i}.rev`,'必填')}</td>
          <td>${selOf(`lines.${i}.mat`,[''].concat(MATS()),l.mat)}</td>
          <td>${inp(`lines.${i}.qty`,'件')}</td>
          <td>${selOf(`lines.${i}.surf`,SURF,l.surf)}</td>
          <td>${pill(STAT_L[l.s])}</td>
          <td style="text-align:right"><button class="btn qui sm" data-line="del:${i}">删除</button></td>
        </tr>${l.s!=='ok'?`<tr class="${l.s==='bad'?'rowbad':'rowwarn'}"><td></td>
          <td colspan="7"><div class="why">${l.s==='bad'
            ? '图纸版本为空，本行不会进入报价。定价与生产都锚定图纸版本，不锚定「最新版」。'
            : '材料未选择，本行不会进入报价。'}</div></td></tr>`:''}`).join('')}
      </tbody></table></div></div>
      <div class="cfoot"><button class="btn" data-line="add">＋ 添加一行</button>
        <span class="sp"></span>

    </div>
  </div>`;
}

const HALL_SORTS = ['综合排序','剩余时间','目标价','数量','交付周期'];

function supHome(){
  if(R.area==='pool') return hallPage();
  return workPage();
}

/* ── 抢单大厅 ─────────────────────────────────────────────────────── */
function hallPage(){
  const s = sel('pool');
  if(s){ const p = DB.pkgs.find(x=>x.id===s); if(p) return hallShell(hallDetail(p)); }
  const all = DB.pkgs.filter(p=>p.status==='open'||p.status==='taken');
  const live = all.filter(p=>p.status==='open');
  return hallShell(`<div class="page">
    <div class="hsearch"><input placeholder="搜零件名、材料、派单号" /><button>搜索</button></div>

    <div class="card" style="margin-bottom:4px"><div class="cbody" style="padding:4px 18px">
      ${HALL_FILTERS.map(([k,opts,dsel])=>`<div class="frow"><span class="fk">${k}</span>
        <span class="fv">${opts.map((o,i)=>
          `<button class="ftag ${i===dsel?'on':''}">${o}</button>`).join('')}</span></div>`).join('')}
    </div></div>

    <div class="sortrow">
      ${HALL_SORTS.map((n,i)=>`<button class="sortlink ${i?'':'on'}">${n}
        ${i?'<span class="ar">⇅</span>':''}</button>`).join('')}
      <span class="rng">目标价 <input placeholder="最低" /><span class="dash">—</span>
        <input placeholder="最高" /></span>
      <span class="sortsp"></span>
      <span class="sortcnt">${live.length} 个可抢 · 共 ${all.length} 个</span>
    </div>

    ${canGrab()?'':`<div class="ban wa" style="margin-bottom:16px"><span class="bi">!</span>
      <div>资质考察通过后才能抢单，现在可以先浏览。</div></div>`}

    ${all.length?`<div class="pgrid">${all.map(poolCard).join('')}</div>`
      :empty('大厅暂时没有派单包')}
  </div>`);
}

const poolCard = (p,i) => `
  <div class="pcd ${p.status!=='open'?'gone':''}" ${p.status==='open'?`data-sel="pool:${p.id}"`:''}>
    <div class="im">${thumb(i)}
      <span class="tag2 ${p.status!=='open'?'gone':''}">
        ${p.status==='open'?'剩 '+T_.grabHours+' 小时':'已被抢'}</span></div>
    <div class="bd">
      <div><div class="nm2">${esc(p.part)} × ${p.qty}</div>
        <div class="sp2">${esc(p.mat)} · ${esc(p.surf)} · Rev ${esc(p.rev)}</div></div>
      <div class="pr"><b>¥ ${M(p.target)}</b><span>/ 件 · 合计 ¥ ${M(p.total)}</span></div>
      <div class="mt2"><span>交付 <b>${esc(p.lead)}</b></span>
        <span>${p.reprice?`已调价 ${p.reprice} 次`:''}</span></div>
      <div class="pay">付款 <b>${p.pay}</b></div>
      <div class="mt2"><span>欧洲客户</span><span class="m">${p.id}</span></div>
      <div class="bt">${p.status==='open'
        ? `<button class="btn" data-sel="pool:${p.id}">详情</button>
           <button class="btn pri" data-do="grab:${p.id}" ${canGrab()?'':'disabled'}>抢单</button>`
        : `<span style="font-size:11.5px;color:var(--faint);padding:7px 0">已被其他供应商抢走</span>`}</div>
    </div>
  </div>`;

/* ── 我的工作台 ───────────────────────────────────────────────────── */
function workPage(){
  const m = {settings:()=>workShell(settingsPage(),'settings'),
             won:()=>workShell(supWon(),'won'), bill:()=>workShell(supBill(),'bill'),
             me:()=>workShell(supMe(),'me')};
  return (m[R.sup]||(()=>workShell(supOrders(),'orders')))();
}

function supOrders(){
  const ps = myPkgs().filter(p=>{const c=DB.contracts.find(x=>x.pkg===p.id); return c&&c.status==='signed';});
  return `<div class="page">
    <div class="hello"><div><h1>我的订单</h1></div><span class="sp"></span>
      <span class="pill ne nd">共 ${ps.length} 单</span></div>
    <div class="card">${ps.length?`<div class="cbody flush"><div class="tw"><table>
      <thead><tr><th>生产订单</th><th>零件</th><th>规格</th><th class="n">数量</th>
        <th class="n">金额</th><th class="n">已完成</th><th>进度</th><th>上报</th></tr></thead>
      <tbody>${ps.map(p=>`<tr>
        <td><span class="m">${p.id}</span></td><td class="t1">${esc(p.part)}</td>

    </tbody></table></div></div>`:`<div class="cbody">${empty('还没有已签合同的生产订单')}</div>`}</div>

function supBill(){
  const ps = myPkgs().filter(p=>p.status==='done');
  const oOf = p => DB.orders.find(x=>x.id===p.so);
  const wait = sum(ps.filter(p=>!(oOf(p)||{}).paidAt), p=>p.total);
  return `<div class="page">
    <div class="hello"><div><h1>对账与开票</h1></div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">已完工金额</div><div class="v">${M(sum(ps,p=>p.total),0)}</div>
        <div class="d">元 · ${ps.length} 单</div></div>
      <div class="kpi alert"><div class="k">待客户回款</div><div class="v">${M(wait,0)}</div>
        <div class="d">元 · 背靠背顺延</div></div>
      <div class="kpi"><div class="k">待开票</div>
        <div class="v">${ps.filter(p=>!p.invoice).length}</div><div class="d">单</div></div>
    </div>
    <div class="card">${ps.length?`<div class="cbody flush"><div class="tw"><table>
      <thead><tr><th>派单号</th><th>零件</th><th class="n">数量</th><th class="n">金额</th>
        <th>客户回款</th><th>应付日</th><th>发票</th><th></th></tr></thead>
      <tbody>${ps.map(p=>{const o=DB.orders.find(x=>x.id===p.so); return `<tr>
        <td><span class="m">${p.id}</span></td><td class="t1">${esc(p.part)}</td>
        <td class="n">${p.qty}</td><td class="n"><b>¥ ${M(p.total)}</b></td>
        <td>${o.paidAt?`<span class="pill ok">${o.paidAt.slice(0,10)}</span>`
          :'<span class="pill wa">待回款</span>'}</td>
        <td>${o.paidAt?`<b>${dueDate(o)}</b>`
          :`<span style="color:var(--muted)">客户回款后 T+${T_.payDays}</span>`}</td>
        <td>${p.invoice?'<span class="pill in">已上传待核验</span>'
          :'<span class="pill wa">待开票</span>'}</td>
        <td style="text-align:right">${p.invoice?'':`<div style="display:flex;gap:6px">
          <input class="inp" style="width:120px;padding:5px 8px" name="invno" placeholder="发票号"
            value="${esc(fv('invno'))}" />
          <button class="btn sm pri" data-do="invoice:${p.id}">上传</button></div>`}</td>
      </tr>`;}).join('')}
    </tbody></table></div></div>`:`<div class="cbody">${empty('还没有完工待结算的订单')}</div>`}</div>
  </div>`;
}

function opsQuotes(){
  return `<div class="page">
    <div class="hello"><div><h1>报价</h1></div></div>
    <div class="card">${DB.quotes.length?`<div class="cbody flush"><div class="tw"><table>
      <thead><tr><th>报价单</th><th>客户</th><th class="n">行数</th><th class="n">对客总额</th>
        <th class="n">供应商目标价合计</th><th class="n">预估毛利率</th><th>状态</th></tr></thead>
      <tbody>${DB.quotes.map(q=>{
        const tgt = sum(q.items,i=>supTarget(i)*N(i.qty));
        const rev = q.total*T_.fx;
        const gm = rev? Math.round((rev-tgt)/rev*100) : 0;
        return `<tr class="clk"><td><span class="m">${q.id}</span></td>
        <td class="t1">${esc(co(q.cid).name)}</td><td class="n">${q.items.length}</td>
        <td class="n">${money(q.total)}</td><td class="n">¥ ${M(tgt)}</td>
        <td class="n"><b>${gm}%</b></td><td>${pill(QT_ST[q.status])}</td></tr>`;}).join('')}
    </tbody></table></div></div>`:`<div class="cbody">${empty('还没有报价')}</div>`}</div>
  </div>`;
}

/* ── 派单管理：拆分树 + 逐包处理 ─────────────────────────────────── */
function opsDisp(){
  const os = DB.orders.filter(o=>DB.pkgs.some(p=>p.so===o.id));
  if(!os.length) return `<div class="page">
    <div class="hello"><div><h1>派单管理</h1></div></div>
    <div class="card"><div class="cbody">${empty('还没有拆出派单包')}</div></div></div>`;
  return `<div class="page">
    <div class="hello"><div><h1>派单管理</h1></div></div>
    ${os.map(o=>{
      const ps = DB.pkgs.filter(p=>p.so===o.id);
      const lock = ps.filter(p=>LOCKED(p.status)).length;
      return `<div class="card" style="margin-bottom:18px">
      <div class="chead"><h2>${o.id}</h2>
        <span class="rid">${esc(co(o.cid).name)}</span><span class="sp"></span>
        <span class="pill ${lock===ps.length?'ok':'wa'}">${lock} / ${ps.length} 行已锁定</span>
        ${pill(ORD_ST[o.status])}</div>
      <div class="cbody flush"><div class="tw"><table>
        <thead><tr><th>行 / 派单号</th><th>零件</th><th class="n">数量</th><th class="n">目标价</th>
          <th>付款周期</th><th>状态</th><th>供应商</th><th></th></tr></thead>
        <tbody>
          <tr class="trow"><td colspan="4"><span class="m">${qtOf(o)?qtOf(o).rfq:''}</span>
            · 对客 ${money(qtTotal(o))}</td>
            <td colspan="4">拆成 <b>${ps.length}</b> 个派单包，各自独立抢单</td></tr>
          ${ps.map(p=>`<tr class="${p.status==='dropped'?'dim':''}">
            <td><span class="kid">└</span><span class="m">${p.id}</span>
              <div class="t2" style="margin-left:15px">第 ${p.line+1} 行</div></td>
            <td><div class="t1">${esc(p.part)}</div>
              <div class="t2">${esc(p.mat)} · ${esc(p.surf)}</div></td>
            <td class="n">${p.qty}</td>
            <td class="n"><b>¥ ${M(p.target)}</b>
              ${p.reprice?`<div class="t2">已调价 ${p.reprice} 次</div>`:''}</td>
            <td>${p.pay}</td>

/* ═══════════════════════════════════════════════════════════════════════
   路由与事件
   ═══════════════════════════════════════════════════════════════════════ */
const CUST_PAGES = {home:custHome, rfq:custRfq, quotes:custQuotes, orders:custOrders,
                    drawings:custDrawings, settings:()=>custShell(settingsPage())};

function view(){
  if(R.screen==='login')    return scLogin();
  if(R.screen==='register') return scRegister();
  if(R.screen==='verify')   return scVerify();
  if(R.screen==='invite')   return scInvite();
  if(R.screen==='supreg')   return scSupReg();
  if(R.screen==='supdone')  return scSupDone();
  const r = ROLE();
  if(r==='ops')      return opsHome();
  if(r==='supplier') return supHome();
  return (CUST_PAGES[R.tab] || custHome)();
}
function render(){
  document.getElementById('app').innerHTML = view();
  window.scrollTo(0,0);
}

/* ── 表单绑定：输入不触发重渲染，值写进 F ─────────────────────────── */
function setPath(name, val){
  const ps = name.split('.'); let o = F;
  for(let i=0;i<ps.length-1;i++){
    const k = ps[i], nx = ps[i+1];
    if(o[k]===undefined) o[k] = /^\d+$/.test(nx) ? [] : {};
    o = o[k];
  }
  o[ps[ps.length-1]] = val;
}
document.addEventListener('input', e=>{
  const n = e.target.name; if(!n) return;
  setPath(n, e.target.type==='checkbox' ? e.target.checked : e.target.value);
  delete F.err;                                  // 一开始改就把报错收掉
});
document.addEventListener('change', e=>{
  const n = e.target.name; if(!n) return;
  setPath(n, e.target.type==='checkbox' ? e.target.checked : e.target.value);
  if(/^lines\.|^mach\./.test(n)) render();      // 离开字段时刷新行状态
});

/* ── 点击 ─────────────────────────────────────────────────────────── */
document.addEventListener('click', e=>{
  const t = e.target;
  const hit = s => t.closest(s);
  const D = s => { const el = t.closest(`[data-${s}]`); return el ? el.dataset[s] : null; };

  /* 语言 / 主题 / 菜单 */
  if(hit('[data-lang]')){ lang = lang==='zh'?'en':'zh'; return render(); }
  const dk = D('dark');
  if(dk){ themeDark = dk==='dark';
    document.documentElement.setAttribute('data-theme', themeDark?'dark':'light'); return render(); }
  if(hit('[data-menu]')){ idMenu = !idMenu; return render(); }
  const ro = D('role');
  if(ro!==null && ro!==undefined){ S.ri = +ro; idMenu=false; R.tab='home'; R.area='pool';
    R.sel={}; return render(); }

  /* 演示账号：填入表单而不是跳过登录 */
  const fill = D('fill');
  if(fill){ const u = usr(fill); F.em = u.mail; F.pw = u.pw; delete F.err; return render(); }

  /* 屏幕跳转 */
  const go = D('go');
  if(go){ e.preventDefault(); delete F.err;
    if(go==='register'||go==='login') clearF();
    if(go==='supreg') R.step = 0;
    R.screen = go; return render(); }

  /* 向导步骤 */
  const stp = D('step');
  if(stp!==null && stp!==undefined){ R.step = +stp; return render(); }

  /* 导航 / 选中 */
  const nav = D('nav');
  const s2  = D('sel');
  if((nav || s2) && !D('do')){
    if(nav){ const [k,v] = nav.split(':');
      if(k==='tab'){ R.tab = v; R.sel = {}; }
      if(k==='sup'){ R.sup = v; R.area = 'work'; R.sel = {}; }
      if(k==='ops'){ R.ops = v; R.sel = {}; } }
    if(s2){ const i = s2.indexOf(':'); const k = s2.slice(0,i), v = s2.slice(i+1);
      if(v==='') { delete R.sel[k]; if(k==='order') delete R.sel.line; }
      else R.sel[k] = (k==='line') ? +v : v;
      if(k==='order') delete R.sel.line; }
    return render(); }

  const ar = D('area');
  if(ar){ R.area = ar; R.sel = {}; return render(); }

  /* 清单行 / 设备行增删 */
  const ln = D('line');
  if(ln){ if(ln==='add') F.lines.push({no:'',rev:'',mat:MATS()[0],qty:'',surf:SURF[0]});
          else F.lines.splice(+ln.split(':')[1],1);
          if(!F.lines.length) F.lines.push({no:'',rev:'',mat:MATS()[0],qty:'',surf:SURF[0]});
          return render(); }
  const mc = D('mach');
  if(mc){ if(mc==='add') F.mach.push({type:'设备类型 1',qty:'',size:'',prec:''});
          else F.mach.splice(+mc.split(':')[1],1);
          return render(); }

  /* 业务动作 */
  const doo = D('do');
  if(!doo) { if(idMenu){ idMenu=false; render(); } return; }
  const [act, arg] = doo.split(':');
  delete F.err;

  if(act==='login'){ const err = A.login(fv('em'), fv('pw'));
    if(err){ F.err = err; } return render(); }
  if(act==='logout'){ A.logout(); return render(); }
  if(act==='signup'){
    if(!fv('rc')||!fv('re')||!fv('rp')){ F.err='请填写公司名称、邮箱和密码'; return render(); }
    if(usr(fv('re'))){ F.err='这个邮箱已经注册过了'; return render(); }
    if(!fv('ragree')){ F.err='请先同意服务条款与隐私政策'; return render(); }
    A.signup(); R.screen='verify'; return render(); }
  if(act==='verify'){ A.verifyMail(); F.em = S.pendingMail; R.screen='login'; return render(); }
  if(act==='onboard'){
    if(!fv('sc')||!fv('smail')||!fv('spw')){ F.err='请填写企业名称、登录邮箱和密码'; return render(); }
    if(usr(fv('smail'))){ F.err='这个邮箱已经注册过了'; return render(); }
    if(!fv('sagree')){ F.err='请先同意框架协议'; return render(); }
    A.onboard(); R.screen='supdone'; return render(); }
  if(act==='invite'){ if(!fv('ivm')){ F.err='请填写接收邮箱'; return render(); }
    A.invite(); return render(); }
  if(act==='approve'){ A.approve(arg, fv('tier.'+arg,'B'), fv('scope.'+arg,'常规件'));
    return render(); }

  if(act==='parse'){ F.lines = A.parseFile().map(l=>({no:l.no,rev:l.rev,mat:l.mat,
    qty:l.qty,surf:l.surf})); return render(); }
  if(act==='submitRfq'){
    const lines = F.lines.filter(l=>lineStat(l)==='ok');
    if(!lines.length){ F.err='至少要有一行填完整 —— 零件号、图纸版本、材料、数量都不能空'; return render(); }
    const r = A.newRfq(lines.map(l=>({...l})));
    const q = A.submitRfq(r);
    clearF('lines','want'); R.tab='quotes'; R.sel={quote:q.id}; return render(); }
  if(act==='accept'){ const q = DB.quotes.find(x=>x.id===arg);
    const o = A.acceptQuote(q); R.tab='orders'; R.sel={order:o.id}; return render(); }

  if(act==='grab'){ const p = DB.pkgs.find(x=>x.id===arg);
    const err = A.grab(p); if(err) F.err = err; else { R.area='work'; R.sup='won'; R.sel={}; }
    return render(); }
  if(act==='sign'){ A.sign(DB.contracts.find(c=>c.id===arg)); return render(); }
  if(act==='report'){ const p = DB.pkgs.find(x=>x.id===arg);
    A.report(p, fv('rep.'+arg, 0)); return render(); }
  if(act==='invoice'){ A.uploadInvoice(DB.pkgs.find(x=>x.id===arg)); return render(); }

  if(act==='repost'){ A.repost(DB.pkgs.find(x=>x.id===arg)); return render(); }
  if(act==='drop'){ A.dropLine(DB.pkgs.find(x=>x.id===arg)); return render(); }
  if(act==='deliver'){ A.deliver(DB.orders.find(o=>o.id===arg)); return render(); }
  if(act==='paid'){ A.custPaid(DB.orders.find(o=>o.id===arg)); return render(); }
  if(act==='saveRates'){
    RATES.forEach((r,i)=>{ const v = fv('rate.'+i); if(v!=='') r.rate = N(v); });
    ['margin','spread','fx','payDays','holdHours','grabHours'].forEach(k=>{
      const v = fv('t.'+k); if(v!=='') T_[k] = N(v); });
    return render(); }
});

/* ── 启动 ─────────────────────────────────────────────────────────── */
seed();
DB.invites.push({id:'IV0', name:'供应商 B', mail:'supplier-b@example.com',
                 at:today(), exp:plus(14), used:false});
document.documentElement.setAttribute('data-theme','light');
render();

</script>
